{% extends 'news/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger shadow-sm mt-4">
            <div class="card-header bg-danger text-white">
                <h4 class="card-title mb-0">Confirm Deletion</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Are you sure you want to delete this news article?</p>
                <div class="alert alert-light border">
                    <strong class="d-block text-truncate">{{ article.title }}</strong>
                    <small class="text-muted">Published: {{ article.published_date|date:"F j, Y" }}</small>
                </div>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'news_detail' article.pk %}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
